services:
  - type: web
    name: aegis-ai-interview
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OPENAI_API_KEY
        sync: false   # Set this in Render Dashboard → Environment
      - key: JWT_SECRET
        generateValue: true
