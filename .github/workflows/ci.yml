name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Lint & TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-cv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-cv/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest tests/ -v --timeout=30
      - run: python -c "from main import app; print('FastAPI app loaded successfully')"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Frontend audit
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=high
      - name: Backend audit
        run: |
          cd backend-cv
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Secret scan
        uses: trufflesecurity/trufflehog@v3
        with:
          extra_args: --only-verified
