version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports: []
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend-cv/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    ports: []
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: aegis-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./backend-cv/prometheus.yml:/etc/prometheus/prometheus.yml
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.1.0
    container_name: aegis-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD is required}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafanadata:/var/lib/grafana
      - ./backend-cv/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./backend-cv/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus

  telemetry-purge:
    image: aegis-backend  # Reuses the same Docker image (requires a cron runner or one-shot)
    container_name: aegis-telemetry-purge
    profiles: ["cron"]
    environment:
      DATABASE_URL: postgresql://aegis:${POSTGRES_PASSWORD}@postgres:5432/aegis
      TELEMETRY_RETENTION_DAYS: "90"
    command: ["python", "scripts/purge_old_telemetry.py", "--apply"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://aegis:${POSTGRES_PASSWORD}@postgres:5432/aegis
      REDIS_URL: redis://redis:6379/0
      # CRITICAL: JWT_SECRET MUST be set in production — no fallback
      JWT_SECRET: ${JWT_SECRET?JWT_SECRET is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  promdata:
  grafanadata:
